[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantization-lab"
version = "0.1.0"
description = "Small, readable experiments in LLM weight quantization"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9,<3",
    "transformers>=5.10,<6",
    "datasets>=5,<6",
    "matplotlib>=3.9,<4",
]

[project.scripts]
quant-lab = "quantization_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
